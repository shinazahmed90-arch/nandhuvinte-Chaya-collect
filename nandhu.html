<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nandhuvinte Chaya</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #18120e; }
    canvas { display: block; }
    #menu, #win {
      position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
      color: #fff3d4; background: linear-gradient(#20150dcc, #120c0bdd); z-index: 2;
    }
    h1 { margin: 0 0 10px; font-size: clamp(2.5rem, 8vw, 5rem); color: #ffd166; }
    p { margin: 8px 0 22px; font-size: 1.1rem; }
    button {
      padding: 14px 30px; border: 0; border-radius: 12px; background: #ef8354;
      color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #ff9b6b; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 1; color: white;
      font-weight: 700; text-shadow: 0 2px 4px #000; display: none;
    }
    #tip {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: white; background: #0009; padding: 9px 14px; border-radius: 10px;
      display: none; white-space: nowrap;
    }
    #win { display: none; }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Nandhuvinte Chaya</h1>
    <p>Grab the chai. Let one rip. Become the tea-shop legend.</p>
    <p>Move: WASD or arrow keys &nbsp;|&nbsp; Fart: Space</p>
    <button id="start">START GAME</button>
  </div>

  <div id="hud">Chai cups: <span id="score">0</span> / 8</div>
  <div id="tip">WASD / arrows to move · Space to fart</div>
  <div id="win">
    <h1>Chaya Champion!</h1>
    <p>You collected all the chai!</p>
    <button id="again">PLAY AGAIN</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bc6d4);
    scene.fog = new THREE.Fog(0x9bc6d4, 18, 42);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 8, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x78583c, 2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(-5, 10, 6);
    sun.castShadow = true;
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(32, 32),
      new THREE.MeshStandardMaterial({ color: 0xc89a62 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Tea-shop walls and colorful stall
    function box(w, h, d, color, x, y, z) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color })
      );
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }
    box(32, 5, 0.5, 0x7c4934, 0, 2.5, -16);
    box(0.5, 5, 32, 0x9a6340, -16, 2.5, 0);
    box(0.5, 5, 32, 0x9a6340, 16, 2.5, 0);
    box(8, 2.8, 1, 0x216c59, 0, 3.6, -12);
    box(9, 0.4, 1.2, 0xe7a64b, 0, 2.1, -11.7);
    box(7, 0.25, 1, 0x65412c, 0, 1.3, -11.5);

    // Sign
    const sign = document.createElement("canvas");
    sign.width = 512; sign.height = 128;
    const ctx = sign.getContext("2d");
    ctx.fillStyle = "#216c59"; ctx.fillRect(0, 0, 512, 128);
    ctx.fillStyle = "#fff0c2"; ctx.font = "bold 48px sans-serif";
    ctx.textAlign = "center"; ctx.fillText("NANDHUVINTE CHAYA", 256, 80);
    const signTexture = new THREE.CanvasTexture(sign);
    const signMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(7.8, 1.95),
      new THREE.MeshBasicMaterial({ map: signTexture })
    );
    signMesh.position.set(0, 3.6, -11.45);
    scene.add(signMesh);

    // Player
    const player = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.48, 0.85, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x4386d1 })
    );
    body.position.y = 0.9;
    body.castShadow = true;
    player.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.38, 20, 16),
      new THREE.MeshStandardMaterial({ color: 0xffc58c })
    );
    head.position.y = 1.75;
    head.castShadow = true;
    player.add(head);
    scene.add(player);

    // Cups
    const cups = [];
    const cupMat = new THREE.MeshStandardMaterial({ color: 0xd65a32 });
    const teaMat = new THREE.MeshStandardMaterial({ color: 0x75401d });
    for (let i = 0; i < 8; i++) {
      const cup = new THREE.Group();
      const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.19, 0.42, 16), cupMat);
      mug.castShadow = true;
      cup.add(mug);
      const tea = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.025, 16), teaMat);
      tea.position.y = 0.215;
      cup.add(tea);
      const angle = i * Math.PI * 2 / 8;
      cup.position.set(Math.cos(angle) * 8, 0.4, Math.sin(angle) * 8);
      cup.userData.baseY = 0.4;
      scene.add(cup);
      cups.push(cup);
    }

    const keys = {};
    const clouds = [];
    let score = 0;
    let running = false;
    let lastFart = 0;

    addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === "Space") { e.preventDefault(); fart(); }
    });
    addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    function fart() {
      if (!running || performance.now() - lastFart < 500) return;
      lastFart = performance.now();
      for (let i = 0; i < 7; i++) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(0.25 + Math.random() * 0.22, 12, 10),
          new THREE.MeshStandardMaterial({
            color: i % 2 ? 0x9bcf66 : 0xc4df72,
            transparent: true, opacity: 0.72
          })
        );
        puff.position.set(
          player.position.x + (Math.random() - 0.5) * 1.2,
          0.4 + Math.random() * 0.8,
          player.position.z + 0.6
        );
        scene.add(puff);
        clouds.push({ mesh: puff, life: 1 });
      }
    }

    function startGame() {
      score = 0;
      document.getElementById("score").textContent = score;
      player.position.set(0, 0, 5);
      cups.forEach(c => c.visible = true);
      clouds.forEach(c => scene.remove(c.mesh));
      clouds.length = 0;
      document.getElementById("menu").style.display = "none";
      document.getElementById("win").style.display = "none";
      document.getElementById("hud").style.display = "block";
      document.getElementById("tip").style.display = "block";
      running = true;
    }

    document.getElementById("start").onclick = startGame;
    document.getElementById("again").onclick = startGame;

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (running) {
        let dx = 0, dz = 0;
        if (keys.w || keys.arrowup) dz -= 1;
        if (keys.s || keys.arrowdown) dz += 1;
        if (keys.a || keys.arrowleft) dx -= 1;
        if (keys.d || keys.arrowright) dx += 1;

        const len = Math.hypot(dx, dz) || 1;
        player.position.x += dx / len * 5 * dt;
        player.position.z += dz / len * 5 * dt;
        player.position.x = THREE.MathUtils.clamp(player.position.x, -14, 14);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -14, 14);
        if (dx || dz) player.rotation.y = Math.atan2(dx, dz);

        cups.forEach(cup => {
          cup.rotation.y += dt * 1.5;
          cup.position.y = cup.userData.baseY + Math.sin(performance.now() * 0.003 + cup.position.x) * 0.08;
          if (cup.visible && cup.position.distanceTo(player.position) < 1.1) {
            cup.visible = false;
            score++;
            document.getElementById("score").textContent = score;
            if (score === 8) {
              running = false;
              document.getElementById("win").style.display = "grid";
            }
          }
        });

        clouds.forEach(c => {
          c.life -= dt;
          c.mesh.position.y += dt * 0.35;
          c.mesh.scale.multiplyScalar(1 + dt * 0.8);
          c.mesh.material.opacity = Math.max(0, c.life * 0.72);
        });
        for (let i = clouds.length - 1; i >= 0; i--) {
          if (clouds[i].life <= 0) {
            scene.remove(clouds[i].mesh);
            clouds.splice(i, 1);
          }
        }
      }

      const target = new THREE.Vector3(player.position.x, 0, player.position.z);
      camera.position.lerp(new THREE.Vector3(target.x, 8, target.z + 10), 0.06);
      camera.lookAt(target.x, 0.7, target.z);
      renderer.render(scene, camera);
    }
    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
``)
